spring.application.name=civic-bridge-api
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Override JWT_SECRET in Render env vars for production; this fallback is dev-only.
jwt.secret=${JWT_SECRET:civicBridgeAfricaDevOnlyFallbackSecretKeyChangeMe123456789}
